# Политика прав доступа ИИ-агента (запреты/разрешения).
# Копируется в data/policy.yaml при первом запуске и правится пользователем
# через вкладку "Права доступа" в приложении или вручную.
version: 1

# Если true — файловые операции по умолчанию разрешены только внутри
# рабочей директории агента (workspace). Всё, что вне неё, требует
# подтверждения (см. confirmation_required_for) либо явного allow-списка.
workspace_only: true

filesystem:
  allow_read: []    # доп. разрешённые glob-пути для чтения вне workspace
  allow_write: []   # доп. разрешённые glob-пути для записи вне workspace
  deny:             # эти пути запрещены всегда, даже внутри workspace
    - "**/.ssh/**"
    - "**/.aws/**"
    - "**/*.pem"
    - "**/*.key"

# Выполнение произвольных команд/скриптов в системе. По умолчанию выключено —
# агент не может ничего запускать, пока пользователь явно не включит.
shell:
  enabled: false
  allow_commands: []   # если список не пуст — разрешены только эти префиксы команд

# Написание вспомогательных скриптов агентом (для самого себя) — безопасная
# операция (просто файл), включена по умолчанию. А вот их ЗАПУСК — отдельный
# флаг, выключен по умолчанию и требует подтверждения.
scripting:
  enabled: true
  execute_enabled: false

network:
  enabled: true
  allow_domains: ["*"]
  deny_domains: []

package_install:
  enabled: false

# Скачивание моделей с Hugging Face Hub (может занимать гигабайты и
# требует времени/трафика) — по умолчанию выключено, каждое скачивание
# требует подтверждения (см. confirmation_required_for).
model_download:
  enabled: false

# Доступ к микрофону (модуль «Диктофон»). Разовая запись — как остальные
# навыки: включил здесь один раз, дальше работает без переспроса на каждый
# вызов. Постоянная (фоновая) запись — отдельный, более строгий флаг:
# подтверждение запрашивается при КАЖДОМ включении режима (не на каждую
# фразу), потому что риск отличается качественно — агент слышит всё, что
# происходит рядом, а не только явно надиктованное.
microphone:
  enabled: false
  continuous_enabled: false
  retain_audio: false   # хранить ли аудиофайлы после расшифровки (по умолчанию — только текст)

# Действия из этого списка агент обязан подтвердить у пользователя перед
# выполнением, даже если политика их в принципе разрешает.
confirmation_required_for:
  - shell.execute
  - scripting.execute
  - package.install
  - model.download
  - files.write_outside_workspace
  - files.read_outside_workspace

audit_log: true
