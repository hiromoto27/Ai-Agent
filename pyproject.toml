[project]
name = "ai-agent"
version = "0.1.0"
description = "Локальный самообучаемый ИИ-агент с системой прав доступа, генерацией документов и автонастройкой под мощность ПК"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
docs = ["python-docx>=1.1", "python-pptx>=1.0", "reportlab>=4.2", "openpyxl>=3.1"]
web = ["httpx>=0.27"]
hf = ["huggingface_hub>=0.24"]
# Не входит в "all": для большинства платформ на PyPI нет готового wheel,
# ставится сборкой из исходников (нужен компилятор C++/CMake). Пользователь
# ставит его явно, если хочет запускать локальные GGUF-модели.
local-llm = ["llama-cpp-python>=0.3"]
# Модуль «Диктофон» (запись с микрофона, локальное распознавание речи).
# Не входит в "all": faster-whisper тянет за собой ctranslate2 (~сотни МБ) —
# это отдельная, необязательная для базового агента функция, а не что-то
# нужное каждому. Ставится явно: pip install "ai-agent[voice]".
voice = ["sounddevice>=0.4", "webrtcvad>=2.0.10", "faster-whisper>=1.0"]
gui = ["PySide6-Essentials>=6.7"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
all = ["ai-agent[llm,docs,web,hf,gui,dev]"]

[project.scripts]
ai-agent = "ai_agent.cli:main"
ai-agent-gui = "ai_agent.ui.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ai_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
